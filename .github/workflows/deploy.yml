name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure ~/.ssh exists
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Add VPS to known_hosts (with custom port)
        run: |
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync files to server (over custom port)
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            -e "ssh -p ${{ secrets.SERVER_PORT }}" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.TARGET_DIR }}

      - name: Remote deploy commands
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            
            cd ${{ secrets.TARGET_DIR }}
            
            echo "📦 Installing dependencies..."
            npm install
            
            echo "🔨 Building application..."
            npm run build
            
            echo "🔍 Verifying build..."
            if [ ! -d "dist" ]; then
              echo "❌ Build failed: dist folder not found"
              exit 1
            fi
            
            if [ ! -f "dist/server.js" ]; then
              echo "❌ Build failed: server.js not found in dist"
              exit 1
            fi
            
            echo "✅ Build successful!"
            
            echo "🚀 Deploying with PM2..."
            
            pm2 delete gata-api-services || true
            pm2 start ecosystem.config.js
            pm2 save
            
            echo "✅ Deployment completed successfully!"
          ENDSSH
