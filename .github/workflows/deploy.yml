name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure ~/.ssh exists
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Add VPS to known_hosts (with custom port)
        run: |
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync files to server (over custom port)
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            -e "ssh -p ${{ secrets.SERVER_PORT }}" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.TARGET_DIR }}

      - name: Remote deploy commands
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            
            cd ${{ secrets.TARGET_DIR }}
            
            echo "🧹 Cleaning up..."
            rm -rf node_modules package-lock.json
            npm cache clean --force
            
            echo "📦 Installing dependencies..."
            NODE_ENV=development npm install
            
            echo "🔨 Building application..."
            npm run build
            
            echo "🚀 Restarting PM2..."
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save
            
            echo "✅ Deployment completed successfully!"
          ENDSSH
