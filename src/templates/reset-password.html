<!-- templates/reset-password.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f8f9fa; padding: 30px; border-radius: 10px;">
        <h2 style="color: #333; text-align: center;">Reset Password</h2>
        
        <p>Halo <strong>{{nama}}</strong>,</p>
        
        <p>Anda telah meminta untuk mereset password akun Anda di GATA System.</p>
        
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{resetUrl}}" style="background-color: #007bff; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; display: inline-block;">
                Reset Password
            </a>
        </div>
        
        <p><strong>Penting:</strong> Link ini akan kedaluwarsa dalam <strong>1 jam</strong>.</p>
        
        <p>Jika Anda tidak meminta reset password, abaikan email ini.</p>
        
        <hr style="margin: 30px 0; border: 1px solid #eee;">
        <p style="font-size: 12px; color: #666; text-align: center;">
            Email ini dikirim otomatis oleh GATA System. Jangan balas email ini.
        </p>
    </div>
</body>
</html>
